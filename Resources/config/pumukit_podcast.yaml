services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true
    bind:
      $pumukitInfo: '%pumukit.info%'

  Pumukit\PodcastBundle\Controller\:
    resource: '../../Controller'
    tags: ['controller.service_arguments']

  Pumukit\PodcastBundle\Command\:
    resource: '../../Command/'
    tags: ['console.command']

  Pumukit\PodcastBundle\Services\ConfigurationService:
    class: Pumukit\PodcastBundle\Services\ConfigurationService
    arguments:
      $channelTitle: '%pumukit_podcast.channel_title%'
      $channelDescription: '%pumukit_podcast.channel_description%'
      $channelCopyright: '%pumukit_podcast.channel_copyright%'
      $itunesCategory: '%pumukit_podcast.itunes_category%'
      $itunesSummary: '%pumukit_podcast.itunes_summary%'
      $itunesSubtitle: '%pumukit_podcast.itunes_subtitle%'
      $itunesAuthor: '%pumukit_podcast.itunes_author%'
      $itunesExplicit: '%pumukit_podcast.itunes_explicit%'
      $feedLimit: '%pumukit_podcast.feed_limit%'
      $seriesFeedLimit: '%pumukit_podcast.series_feed_limit%'
      $cacheTtl: '%pumukit_podcast.cache_ttl%'
      $image: '%pumukit_podcast.image%'
      $language: '%pumukit_podcast.language%'
      $tagFeedsChannel: '%pumukit_podcast.tag_feeds.channel%'
      $tagFeedsGroups: '%pumukit_podcast.tag_feeds.groups%'

  Pumukit\PodcastBundle\Services\EpisodeRepository: ~

  Pumukit\PodcastBundle\Services\FeedWriter: ~

  Pumukit\PodcastBundle\Services\FeedService:
    arguments:
      $cache: '@pumukit_podcast.cache'
